<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우진글로벌 상세페이지 제작기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 메인: 제품군을 고르는 첫 화면. 제품군마다 전략과 제작기가 따로 있어요. 새 제품군은 아래 목록(KINDS)에 한 줄을 더해요. */
:root{
  --font:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --bg:#f3f5fa;--panel:#ffffff;--line:#d9e0ec;--ink:#14213d;--mute:#586478;
  --accent:#2a56a3;--accent-ink:#ffffff;--accent-soft:#e6eefb;--ok:#1b7a52;--ok-soft:#e3f4ec;--wait:#7a6a2b;--wait-soft:#f6efd3;
  --shadow:0 1px 2px rgba(16,28,59,.06),0 10px 28px rgba(16,28,59,.08);color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e1320;--panel:#161d2e;--line:#2a3550;--ink:#e8edf7;--mute:#9aa7c0;
  --accent:#8fb0ee;--accent-ink:#0b1530;--accent-soft:#1f2b46;--ok:#5fd0a0;--ok-soft:#173428;--wait:#e6d58a;--wait-soft:#3a3212;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6}
main{max-width:1040px;margin:0 auto;padding:40px 16px 56px}
.eyebrow{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:.02em}
h1{margin:6px 0 10px;font-size:clamp(26px,5vw,38px);font-weight:800;letter-spacing:-.03em;line-height:1.25}
.lead{margin:0;color:var(--mute);font-size:17px;max-width:38em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:28px}
.card{display:flex;flex-direction:column;gap:12px;padding:22px;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow);color:inherit;text-decoration:none}
a.card{transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
a.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card.soon{box-shadow:none;background:transparent;border-style:dashed}
.tag{align-self:flex-start;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.tag.new{background:var(--ok-soft);color:var(--ok)}
.tag.wait{background:var(--wait-soft);color:var(--wait)}
.card h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.card .one{margin:0;font-weight:500}
.card ul{margin:0;padding-left:1.1em;color:var(--mute);font-size:15px}
.card li+li{margin-top:2px}
.go{margin-top:auto;padding-top:6px;font-weight:700;color:var(--accent)}
.how{margin-top:32px;padding:20px 22px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
.how h3{margin:0 0 8px;font-size:17px}
.how p{margin:0;color:var(--mute);font-size:15px}
.how p+p{margin-top:6px}
footer{margin-top:24px;color:var(--mute);font-size:13px}
</style>
</head>
<body>
<main>
  <div class="eyebrow">우진글로벌</div>
  <h1>상세페이지 제작기</h1>
  <p class="lead">제품군마다 손님이 사고 싶어지는 이유가 달라요. 그래서 전략도, 제작기도 제품군마다 따로 있어요. 만들 제품군을 골라 주세요.</p>

  <div class="grid" id="grid"></div>

  <section class="how">
    <h3>업데이트는 이렇게 해요</h3>
    <p><b>매일 아침</b> 어제 바뀐 것과 오늘 고칠 한 가지를 알림으로 알려 드려요. 알림은 제안만 하고, 고치는 일은 말씀하실 때만 해요.</p>
    <p><b>매주 월요일</b> 한 주 동안 모은 것을 묶어 제작기 버전을 올려요.</p>
  </section>

  <footer>제품군마다 전략 문서가 따로 있어요(저장소의 docs 폴더). 키(API key)는 이 주소에 들어 있지 않고, 쓰는 사람이 화면에 직접 붙여 넣어요.</footer>
</main>
<script>
/* 제품군 목록. 새 제품군을 만들면 여기에 한 줄을 더하고, 같은 이름의 폴더를 만들어요. */
const KINDS=[
  {dir:'handle/',tag:'쓰는 중',name:'방문 손잡이 · 도어',one:'정확한 모양과 규격을 먼저 보여 줘요.',
   points:['문에 달린 모습을 먼저, 디자인은 확대 사진으로','규격·맞는 문 확인으로 잘못 사는 일 줄이기','특허·인증·회사 소개로 믿음 주기']},
  {dir:'cleaning/',tag:'새로 만듦',cls:'new',name:'청소용품',one:'사진 한 장으로 쓰는 장면까지 자동으로 만들어요.',
   points:['불편했던 점 → 먼저 해결했어요 순서로 공감부터','거실·현관·주방에서 쓰는 장면을 자동으로','확인할 점을 먼저 말해 믿음 주기']},
  {soon:true,tag:'준비 중',cls:'wait',name:'다음 제품군',one:'제품군이 정해지면 전략부터 따로 세워요.',
   points:['어떤 손님이 왜 사는지부터 정리','그 제품군에 맞는 구역 순서와 사진 장면','같은 방식으로 제작기를 하나 더']}
];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('grid').innerHTML=KINDS.map(k=>{
  const inner='<span class="tag '+(k.cls||'')+'">'+esc(k.tag)+'<span data-ver="'+esc(k.dir||'')+'"></span></span><h2>'+esc(k.name)+'</h2><p class="one">'+esc(k.one)+'</p><ul>'+k.points.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul>'+(k.soon?'':'<div class="go">제작기 열기 →</div>');
  return k.soon?'<div class="card soon">'+inner+'</div>':'<a class="card" href="'+esc(k.dir)+'">'+inner+'</a>';
}).join('');
/* 제작기마다 지금 버전을 읽어 이름표 옆에 붙여요(못 읽으면 조용히 넘어가요) */
if(/^https?:$/.test(location.protocol))KINDS.filter(k=>k.dir).forEach(async k=>{
  try{const r=await fetch(k.dir+'version.json?'+Date.now(),{cache:'no-store'}),d=await r.json();
    if(d&&d.v){const el=document.querySelector('[data-ver="'+k.dir+'"]');if(el)el.textContent=' · 버전 '+d.v;}}catch(e){}
});
</script>
</body>
</html>
