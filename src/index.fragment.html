<title>손잡이 상세페이지 제작기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&display=swap">
<style>
/* 왼쪽: 순서대로 따라가는 작업 칸(1 제품 → 2 키 → 3 만들기 → 4 다듬기), 오른쪽: 860px 상세페이지 실시간 미리보기 */
:root{
  --font:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --bg:#f3f5fa;--panel:#ffffff;--panel-2:#f6f8fc;--line:#d9e0ec;--ink:#14213d;--mute:#586478;
  --accent:#2a56a3;--accent-ink:#ffffff;--accent-soft:#e6eefb;
  --need:#ffe480;--need-ink:#5b4600;--ok:#1b7a52;--bad:#b3261e;--stage:#e1e7f1;
  --shadow:0 1px 2px rgba(16,28,59,.06),0 10px 28px rgba(16,28,59,.08);
  /* 상세페이지 자체 색(테마와 상관없이 고정) */
  --pg-ink:#14213d;--pg-mute:#5a6578;--pg-blue:#2a56a3;--pg-navy:#101c3b;--pg-navy-2:#1b2b52;--pg-navy-d:#0b1226;
  --pg-gold:#d9b45e;--pg-cream:#fbf2d9;--pg-soft:#eef2f8;--pg-line:#dfe5ef;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1320;--panel:#161d2e;--panel-2:#1b2438;--line:#2a3550;--ink:#e8edf7;--mute:#9aa7c0;
  --accent:#8fb0ee;--accent-ink:#0b1530;--accent-soft:#1f2b46;--need:#4a3d0a;--need-ink:#ffe480;--ok:#5fd0a0;--bad:#ff8a80;--stage:#0a0e19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1320;--panel:#161d2e;--panel-2:#1b2438;--line:#2a3550;--ink:#e8edf7;--mute:#9aa7c0;
  --accent:#8fb0ee;--accent-ink:#0b1530;--accent-soft:#1f2b46;--need:#4a3d0a;--need-ink:#ffe480;--ok:#5fd0a0;--bad:#ff8a80;--stage:#0a0e19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
.brand small{color:var(--mute);font-size:13px}
.top-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--need);color:var(--need-ink);cursor:pointer;border:0}

.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(340px,470px) minmax(0,1fr);gap:16px}
.side{overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-right:2px;min-width:0}
.stage-wrap{min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}
.stage-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--mute);font-size:13px}
.stage{flex:1;min-height:0;overflow:auto;background:var(--stage);border-radius:16px;padding:16px;display:flex;justify-content:center;align-items:flex-start}
.paper-wrap{flex:none;width:calc(860px*var(--s,1));height:calc(var(--h,1000)*1px*var(--s,1));position:relative}
.paper{position:absolute;left:0;top:0;transform:scale(var(--s,1));transform-origin:0 0;box-shadow:0 12px 40px rgba(0,0,0,.18)}

.step{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.step>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;font-weight:700;font-size:16px}
.step>summary::-webkit-details-marker{display:none}
.step .no{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:14px;font-weight:800}
.step .st{margin-left:auto;font-size:12px;font-weight:700;color:var(--mute)}
.step .body{padding:2px 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hint{margin:0;color:var(--mute);font-size:13px}
.sub{border:1px solid var(--line);border-radius:12px;background:var(--panel-2)}
.sub>summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:700;display:flex;gap:8px;align-items:center}
.sub>summary::-webkit-details-marker{display:none}
.sub>summary::after{content:"▾";margin-left:auto;color:var(--mute)}
.sub[open]>summary::after{content:"▴"}
.sub .body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:12px}
.sub .cnt{font-size:12px;font-weight:700;color:var(--need-ink);background:var(--need);border-radius:999px;padding:1px 8px}
.cmn{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px}
.blk{border:1px solid var(--line);border-radius:12px;background:var(--panel-2);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.blk h3{margin:0;font-size:14px}

.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>span{font-size:13px;font-weight:700;color:var(--mute)}
.f input[type=text],.f input[type=password],.f textarea,.f select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);min-width:0}
.f textarea{resize:vertical;line-height:1.5}
.f .blank{background:var(--need);border-color:#d3a800;color:var(--need-ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:10px;display:flex;flex-direction:column;gap:10px}
.item-h{display:flex;align-items:center;gap:6px}
.item-h b{font-size:13px}
.item-h .sp{flex:1}
.ib{min-width:34px;min-height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}
.ib:hover{border-color:var(--accent)}

.pc{display:flex;flex-direction:column;gap:8px}
.pc-top{display:flex;gap:10px;align-items:center}
.thumb{flex:none;width:64px;height:64px;border-radius:10px;border:1px dashed var(--line);background:var(--panel-2) center/cover no-repeat;display:grid;place-items:center;color:var(--mute);font-size:11px;text-align:center;cursor:pointer;overflow:hidden}
.thumb.drag{border-color:var(--accent);background-color:var(--accent-soft)}
.pc-btns{display:flex;gap:6px;flex-wrap:wrap}
.pos{font-size:13px}
.pos summary{cursor:pointer;color:var(--accent);font-weight:700}
.pos .sl{display:grid;grid-template-columns:48px 1fr 44px;gap:8px;align-items:center;margin-top:6px}
.pos output{font-variant-numeric:tabular-nums;color:var(--mute);text-align:right}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
.chk select{min-height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:2px 6px}
.flash{animation:flash 1.2s ease 1}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}

.checks{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.msg{font-size:14px;color:var(--mute)}
.msg.err{color:var(--bad);font-weight:700}
.msg.ok{color:var(--ok);font-weight:700}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border-radius:10px;background:var(--need);color:var(--need-ink);font-size:14px;font-weight:700}
.tip{padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:13px;color:var(--ink)}
.cost{font-size:12px;color:var(--mute);margin:0}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.job{display:grid;grid-template-columns:64px 1fr;gap:6px 12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
.job .meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.job .nm{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.job .ratio{font-size:12px;font-weight:700;color:var(--mute);background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.job .done{font-size:12px;color:var(--ok);font-weight:700}
.job details{grid-column:1/-1}
.job pre{margin:6px 0 0;white-space:pre-wrap;font:inherit;font-size:13px;color:var(--mute);background:var(--panel-2);border-radius:8px;padding:8px 10px}
.aitag{font-size:12px;color:var(--mute);cursor:pointer}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:50;box-shadow:var(--shadow);max-width:90vw}
.toast[hidden]{display:none}
.veil{position:fixed;inset:0;background:rgba(8,12,24,.55);z-index:40;display:grid;place-items:center;padding:16px}
.dlg{width:min(520px,100%);max-height:90%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg h2{margin:0;font-size:18px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt b{display:block;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.dlg .acts{justify-content:flex-end}
.orow{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.orow .od{flex:none;width:10px;height:10px;border-radius:50%;background:var(--line)}
.orow.run .od{background:var(--accent);animation:pulse 1s ease-in-out infinite}
.orow.ok .od{background:var(--ok)}.orow.err .od{background:var(--bad)}
.orow .ost{margin-left:auto;font-size:13px;color:var(--mute);text-align:right;min-width:0}
.orow.err .ost{color:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
.tabs{display:none}
@media (max-width:900px){
  .work{grid-template-columns:minmax(0,1fr)}
  body[data-tab="edit"] .stage-wrap{display:none}
  body[data-tab="view"] .side{display:none}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tabs .btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){.flash,.orow.run .od{animation:none}.bar i{transition:none}}

/* ============ 상세페이지(860px) ============ */
.pg{width:860px;background:#fff;color:var(--pg-ink);font-family:var(--font);line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
.pg *{box-sizing:border-box}
.pg .sec{position:relative;padding:92px 62px}
.pg .soft{background:var(--pg-soft)}
.pg .white{background:#fff}
.pg .head{text-align:center}
.pg .eyebrow{font-size:15px;font-weight:700;letter-spacing:.16em;color:var(--pg-blue)}
.pg h2{margin:12px 0 20px;font-size:40px;line-height:1.3;font-weight:800;letter-spacing:-.025em}
.pg .lead{margin:0 auto;max-width:660px;font-size:20px;line-height:1.75;color:var(--pg-mute)}
.pg .pb{background-repeat:no-repeat;background-color:#e8edf5}
.pg .r24{border-radius:24px}.pg .r20{border-radius:20px}
.pg .ph-empty{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:repeating-linear-gradient(135deg,#e4e9f2 0 14px,#dde3ee 14px 28px);color:#7a879d;font-size:17px;font-weight:700;text-align:center;padding:20px}
.pg .ph-empty svg{width:150px;height:auto;opacity:.85}
.pg .tmp{position:absolute;right:14px;top:14px;background:rgba(16,28,59,.78);color:#fff;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px}
.pg .need{display:inline-block;background:#ffe480;color:#5b4600;font-size:.62em;font-weight:700;letter-spacing:0;padding:.1em .7em;border-radius:6px;outline:2px dashed #d3a800;outline-offset:1px;line-height:1.5;vertical-align:middle;cursor:pointer}
.pg [data-jump]{cursor:pointer}
.pg [data-jump]:hover{outline:2px solid rgba(42,86,163,.45);outline-offset:3px;border-radius:6px}

.pg .hero{padding:0;height:1040px;background:var(--pg-navy-d);overflow:hidden}
.pg .hero .pb{position:absolute;left:0;top:0}
.pg .hero .ph-empty{background:linear-gradient(160deg,#1b2b52,#0b1226);color:#8da0c6}
.pg .hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,15,32,0) 36%,rgba(10,15,32,.6) 62%,rgba(10,15,32,.97) 100%);pointer-events:none}
.pg .hero .txt{position:absolute;left:62px;right:62px;bottom:76px;color:#fff}
.pg .badge{display:inline-block;background:var(--pg-blue);color:#fff;font-weight:700;font-size:19px;padding:9px 22px;border-radius:999px}
.pg h1{margin:24px 0 18px;font-size:54px;line-height:1.27;font-weight:800;letter-spacing:-.03em}
.pg .hero p{margin:0;font-size:22px;line-height:1.65;color:rgba(255,255,255,.78)}
.pg .card-ph{margin-top:46px}

.pg .zi{margin-top:56px}
.pg .zi:first-of-type{margin-top:46px}
.pg .zp{position:relative;width:736px;height:560px;border-radius:24px;overflow:hidden;background:#e8edf5}
.pg .zp .pb{position:absolute;left:0;top:0}
.pg .ztag{position:absolute;right:20px;top:20px;background:var(--pg-blue);color:#fff;font-weight:700;font-size:18px;padding:8px 20px;border-radius:999px}
.pg .zin{position:absolute;left:20px;top:20px;width:188px;height:188px;background:#fff;border:6px solid #fff;border-radius:18px}
.pg .zin .cr{position:absolute}
.pg .zin img{max-width:none}
.pg .zin .rb{position:absolute;border:3px solid #e5384f;background:rgba(229,56,79,.1)}
.pg .zi h3{margin:24px 0 8px;text-align:center;font-size:28px;font-weight:800;letter-spacing:-.02em}
.pg .zi p{margin:0 auto;max-width:620px;text-align:center;font-size:19px;line-height:1.7;color:var(--pg-mute)}

.pg .cgrid{display:grid;grid-template-columns:356px 356px;gap:34px 24px;margin-top:46px}
.pg .cell{margin:0}
.pg .cell figcaption{margin-top:14px;text-align:center;font-size:19px;font-weight:700}
.pg .note{margin:34px 0 0;text-align:center;font-size:15px;color:var(--pg-mute)}

.pg .about{background:var(--pg-navy);color:#fff}
.pg .about .eyebrow{color:var(--pg-gold)}
.pg .about h2{color:#fff}
.pg .about .lead{color:#b8c3dc;max-width:700px}
.pg .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:46px}
.pg .stat{background:var(--pg-navy-2);border:1px solid rgba(217,180,94,.28);border-radius:20px;padding:26px 10px;text-align:center}
.pg .stat b{display:block;font-size:46px;line-height:1.1;font-weight:900;color:var(--pg-gold)}
.pg .stat span{display:block;margin-top:10px;font-size:16px;font-weight:700;color:#e8edf7}
.pg .pat{display:flex;gap:20px;align-items:center;margin-top:18px;padding:28px 30px;border-radius:24px;background:var(--pg-cream);border:3px solid #e8cf8c;color:#2a2410}
.pg .pat:first-of-type{margin-top:30px}
.pg .pat .pt{flex:1;min-width:0}
.pg .pat .no{font-size:25px;font-weight:800}
.pg .pat .nm{margin-top:6px;font-size:18px;font-weight:700}
.pg .pat .mt{margin-top:6px;font-size:15px;color:#7a6a38}
.pg .seal{flex:none;width:92px;height:92px;border-radius:50%;background:var(--pg-gold);color:#fff;display:grid;place-items:center;text-align:center;font-weight:800;font-size:18px;line-height:1.25;padding:10px}
.pg h3.sb{margin:50px 0 20px;text-align:center;font-size:27px;font-weight:800;color:#fff}
.pg .gr{display:flex;gap:20px;align-items:center;margin-top:14px;padding:22px 24px;border-radius:20px;background:var(--pg-navy-2);border:1px solid rgba(255,255,255,.06)}
.pg .gr .seal{width:70px;height:70px;font-size:15px}
.pg .gr b{display:block;font-size:22px}
.pg .gr span{display:block;margin-top:4px;font-size:16px;color:#aebad6}
.pg .tl{display:flex;gap:24px;align-items:center;margin-top:12px;padding:18px 24px;border-radius:16px;background:var(--pg-navy-2)}
.pg .tl .yr{flex:none;width:92px;font-size:30px;font-weight:900;color:var(--pg-gold)}
.pg .tl .tt{font-size:16px;line-height:1.6;color:#dbe3f3}
.pg .foot{margin-top:44px;text-align:center;font-size:19px;font-weight:700}
.pg .fn{margin:12px auto 0;max-width:660px;text-align:center;font-size:14px;line-height:1.7;color:#93a1c2}

.pg .steps{position:relative;margin-top:50px;display:flex;flex-direction:column;gap:28px}
.pg .steps::before{content:"";position:absolute;left:27px;top:28px;bottom:28px;width:3px;background:#c8d4ea}
.pg .gs{position:relative;display:flex;gap:26px;align-items:center}
.pg .gs i{flex:none;width:56px;height:56px;border-radius:50%;background:var(--pg-blue);color:#fff;font-style:normal;font-weight:800;font-size:25px;display:grid;place-items:center;border:5px solid var(--pg-soft)}
.pg .gs div{font-size:23px;font-weight:700;line-height:1.5}
.pg .gtime{display:inline-block;margin-top:20px;background:#fff;border:2px solid var(--pg-blue);color:var(--pg-blue);font-weight:800;font-size:22px;padding:8px 24px;border-radius:999px}
.pg .qa{margin-top:18px;padding:26px 30px;border-radius:22px;background:#fff;border:1px solid #e0e6f1}
.pg .qa:first-of-type{margin-top:46px}
.pg .qa .q{display:flex;gap:16px;align-items:center;font-size:22px;font-weight:800}
.pg .qa .q i{flex:none;width:42px;height:42px;border-radius:50%;background:var(--pg-blue);color:#fff;font-style:normal;font-size:20px;display:grid;place-items:center}
.pg .qa .a{margin:12px 0 0 58px;font-size:19px;line-height:1.75;color:var(--pg-mute)}
.pg .nt{padding:70px 62px}
.pg .nt h3{margin:0 0 26px;text-align:center;font-size:27px;font-weight:800}
.pg .nt ul{margin:0;padding:26px 34px 26px 52px;border-radius:18px;background:#f2f4f9;display:flex;flex-direction:column;gap:10px;font-size:17px;color:var(--pg-mute);line-height:1.65}
.pg .cta{padding:100px 62px;background:var(--pg-blue);color:#fff;text-align:center}
.pg .cta h2{color:#fff;margin:0 0 20px;font-size:42px}
.pg .cta p{margin:0;font-size:21px;line-height:1.7;color:rgba(255,255,255,.84)}
.export-host{position:absolute;left:-12000px;top:0;width:860px;pointer-events:none}
</style>

<div id="app">
  <header class="top">
    <div class="brand"><h1>손잡이 상세페이지 제작기</h1><small>우진글로벌 · 버전 21</small></div>

const idb={db:null,mem:new Map(),
  open(){return new Promise(res=>{try{const r=indexedDB.open('wj-dp',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>res();}catch(e){res()}})},
  tx(m){return this.db.transaction('p',m).objectStore('p')},
  put(id,v){this.mem.set(id,v);if(!this.db)return Promise.resolve();return new Promise(r=>{try{const q=this.tx('readwrite').put(v,id);q.onsuccess=q.onerror=()=>r()}catch(e){r()}})},
  get(id){if(this.mem.has(id))return Promise.resolve(this.mem.get(id));if(!this.db)return Promise.resolve(null);return new Promise(r=>{try{const q=this.tx('readonly').get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})},
  del(id){this.mem.delete(id);if(!this.db)return;try{this.tx('readwrite').delete(id)}catch(e){}}
};
function remember(id,blob,w,h){PH.set(id,{blob,w,h,url:URL.createObjectURL(blob)});}
async function ingest(file){
  if(!file||!/^image\//.test(file.type))throw new Error('이미지 파일이 아니에요.');
  let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'});}
  catch(e){bmp=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('사진을 읽지 못했어요.'));i.src=URL.createObjectURL(file);});}
  const iw=bmp.width||bmp.naturalWidth,ih=bmp.height||bmp.naturalHeight,k=Math.min(1,2400/Math.max(iw,ih));
  const w=Math.max(1,Math.round(iw*k)),h=Math.max(1,Math.round(ih*k));
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  const png=file.type==='image/png'||file.type==='image/webp';
  if(!png){g.fillStyle='#fff';g.fillRect(0,0,w,h);}
  g.drawImage(bmp,0,0,w,h);
  const blob=await new Promise(r=>c.toBlob(r,png?'image/png':'image/jpeg',.92));
  if(!blob)throw new Error('사진을 읽지 못했어요.');
  const id=uid();PENDING.add(id);remember(id,blob,w,h);await idb.put(id,{blob,w,h});
  return {id,w,h};
}
function usedIds(){const s=new Set();const walk=o=>{if(!o||typeof o!=='object')return;if(typeof o.id==='string'&&o.w&&o.h)s.add(o.id);for(const k in o)walk(o[k]);};walk(S);return s;}
function gc(){const u=usedIds();for(const [id,m] of PH){if(!u.has(id)&&!PENDING.has(id)){try{URL.revokeObjectURL(m.url)}catch(e){}PH.delete(id);idb.del(id);}}}
async function setPhoto(path,file,extra){
  const meta=await ingest(file);
  if(path==='src')setP(path,{id:meta.id,w:meta.w,h:meta.h});
  else setP(path,Object.assign({id:meta.id,w:meta.w,h:meta.h,fx:.5,fy:.5,z:1,ai:false},extra||{}));
  PENDING.delete(meta.id);gc();
}
const hasPhoto=p=>!!(p&&p.id&&PH.has(p.id));

let saveT=0;
const persist=()=>{clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}},400);};
function fromSaved(o){                       // 저장본 → 현재 형식(예전 버전 파일도 읽어요)
  if(!o||(o.v!==2&&o.v!==3))return null;
  const b=defaults(),r=Object.assign(b,o,{v:3});
  r.colors=Object.assign({},b.colors,o.colors||{});
  r.colors.items=((o.colors&&o.colors.items)||b.colors.items).map(it=>({label:it.label||'',scene:it.scene||'',door:it.door||(it.plate&&it.plate.f)||'groove',view:it.view||'f',flip:it.flip!==undefined?!!it.flip:!!(it.pose&&it.pose.flip),photo:it.photo&&!it.photo.comp?it.photo:null}));
  ['hero','concept'].forEach(k=>{const h=Object.assign({},b[k],o[k]||{});delete h.how;if(h.photo&&h.photo.comp)h.photo=null;r[k]=h;});
  ['cut','cutL','cutC','cutS','cut2','shape','tone','seen','check','cv','desc'].forEach(k=>delete r[k]);
  return r;
}
async function loadPhotos(){                  // S 안의 사진을 저장소에서 불러오고, 사라진 사진 칸은 비워요
  const ids=[];const walk=x=>{if(!x||typeof x!=='object')return;if(typeof x.id==='string'&&x.w&&x.h)ids.push(x);for(const k in x)walk(x[k]);};walk(S);
  await Promise.all(ids.map(async p=>{const r=await idb.get(p.id);if(r&&r.blob)remember(p.id,r.blob,r.w,r.h);}));
  const fix=o=>{if(!o||typeof o!=='object')return;for(const k in o){const v=o[k];if(v&&typeof v==='object'&&typeof v.id==='string'&&v.w&&v.h&&!PH.has(v.id))o[k]=null;else fix(v);}};fix(S);
}
async function restore(){
  let raw=null;try{raw=localStorage.getItem(LS)}catch(e){}
  if(!raw)return;
  try{const o=fromSaved(JSON.parse(raw));if(!o)return;S=o;await loadPhotos();}catch(e){S=defaults();}
}
/* 한글 파일 이름이 깨질 수 있어 내 컴퓨터에서는 영문 이름으로 내려받아요 */
const asciiName=n=>{if(/^[\x20-\x7e]+$/.test(n))return n;const ext=(n.match(/\.[A-Za-z0-9]+$/)||[''])[0];return (/작업/.test(n)?'detailpage-work':'detailpage')+'-'+new Date().toISOString().slice(0,10)+ext;};
async function saveFile(name,blob){
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){}
  if(dl){await dl.save({filename:name,data:blob});return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=asciiName(name);document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
}
const safeName=()=>String(S.name||'상세페이지').replace(/[\\/:*?"<>|\s]+/g,'_').slice(0,40);
async function saveWork(){
  if(!window.JSZip){toast('저장 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.',3000);return;}
  try{
    const z=new JSZip();z.file('state.json',JSON.stringify(S));
    const u=usedIds();for(const id of u){const m=PH.get(id);if(m)z.file('photos/'+id+'.bin',m.blob);}
    z.file('photos/index.json',JSON.stringify([...u].map(id=>{const m=PH.get(id);return m?{id,w:m.w,h:m.h,type:m.blob.type}:null;}).filter(Boolean)));
    await saveFile(safeName()+'_작업.zip',await z.generateAsync({type:'blob',compression:'STORE'}));toast('작업을 저장했어요.');
  }catch(e){toast(e&&e.code==='declined'?'저장을 취소했어요.':'저장하지 못했어요. 한 번 더 눌러 주세요.',3000);}
}
async function loadWork(f){
  if(!window.JSZip){toast('불러오기 도구를 불러오지 못했어요.',3000);return;}
  try{
    const z=await JSZip.loadAsync(f),st=fromSaved(JSON.parse(await z.file('state.json').async('string')));if(!st)throw new Error('v');
    const idx=JSON.parse(await z.file('photos/index.json').async('string'));
    for(const it of idx){const fl=z.file('photos/'+it.id+'.bin');if(!fl)continue;const blob=new Blob([await fl.async('blob')],{type:it.type||'image/jpeg'});remember(it.id,blob,it.w,it.h);await idb.put(it.id,{blob,w:it.w,h:it.h});}
    S=st;dirty=false;gc();renderSide();refresh();toast('작업을 불러왔어요.');
  }catch(err){toast('이 파일은 불러올 수 없어요. 이 프로그램에서 저장한 zip인지 확인해 주세요.',3500);}
}

function geom(m,bw,bh,p){
  const z=clamp((p&&p.z)||1,1,4),fx=p&&p.fx!=null?p.fx:.5,fy=p&&p.fy!=null?p.fy:.5;
  const s=Math.max(bw/m.w,bh/m.h)*z,sw=m.w*s,sh=m.h*s;
  return {sw,sh,x:clamp(bw/2-fx*sw,bw-sw,0),y:clamp(bh/2-fy*sh,bh-sh,0)};
}

  if(m)return pic(m,geom(m,bw,bh,p));

function promptOf(j){
  const base='첨부한 사진 속 "'+(S.name||'이 제품')+'" 제품을 기준으로 이미지를 만들어 주세요.\n'
    +'제품의 모양, 무늬, 금속 마감, 색, 크기 비율, 받침 모양은 절대 바꾸거나 새로 그리지 말고 사진 그대로 유지하세요. 레버의 길이·굵기·끝 모양, 받침의 크기와 모양, 나사 구멍 같은 작은 부분까지 똑같이 두고, 없는 무늬나 장식을 더하지 마세요.\n글자, 로고, 워터마크는 넣지 마세요.\n';
  if(j.kind==='hero')return base+'장면: 고급 제품 광고 사진. 짙은 남색~검정 스튜디오 배경에 이 제품 하나만 화면 위쪽 60% 영역에 크게(레버와 받침이 모두 잘리지 않게), 약간 비스듬한 각도로 놓고, 한쪽에서 오는 부드러운 빛이 금속의 결과 윤곽을 살려 주세요. 제품 아래에 은은한 반사. 화면 아래쪽 40%는 어둡게 비워 두세요(글자가 들어갈 자리). 다른 물체나 글자는 넣지 마세요. 비율은 세로 4:5.';
  if(j.kind==='concept')return base+'장면: 어두운 남회색 스튜디오 배경에 이 제품 하나만 중앙에 크게(전체가 잘리지 않게) 놓고, 옆에서 비추는 부드러운 빛으로 레버 끝과 받침의 금속 질감이 선명하게 보이게, 바닥에 은은한 반사. 다른 물체나 글자는 넣지 마세요. 비율은 가로 3:2.';
  const it=S.colors.items[j.i],sc=(it.scene||j.name).trim(),vw=CAMS[it.view||'f']||CAMS.f,dir=it.flip?'오른쪽':'왼쪽',fr=DOORF[it.door]||'';
  const real='실제 인테리어 사진처럼 사실적으로. 손잡이 받침은 문에 단단히 붙어 있고, 받침과 레버 아래·옆으로 부드러운 접촉 그림자가 드리우게. 금속 표면에는 은은한 하이라이트, 배경은 살짝 흐리게(얕은 심도), 창가의 자연스러운 실내 빛. ';
  if(/손/.test(sc))return base+'장면: '+sc+'. '+real+'카메라: '+vw+'. 손은 자연스러운 한 손(손가락 5개)이 레버를 위에서 잡아 아래로 누르는 순간. 손만 보이고 얼굴·몸은 나오지 않게. 레버는 화면 '+dir+'으로 뻗게. 비율은 정사각형 1:1.';
  return base+'장면: '+sc+'에 이 손잡이가 실제로 설치된 모습을 가까이에서 찍은 사진. 문 표면이 화면을 가득 채우고 문 전체는 보이지 않는 가까운 구도.\n카메라: '+vw+'.\n손잡이 방향: 레버가 화면 '+dir+'으로 뻗게.\n'+(fr?'문: '+fr+'.\n':'')
    +real+'손잡이 모양과 마감은 첨부 사진과 똑같이 유지하고, 문의 색과 질감만 위 설명대로 바꿔 주세요. 비율은 정사각형 1:1.';
}

const CHK_PROMPT='첫 번째 사진은 실제 제품(원본)이고, 두 번째 사진은 AI가 만든 연출 사진입니다. 두 번째 사진 속 손잡이가 원본과 같은 제품으로 보이는지 비교하세요. 비교할 것: 레버의 길이·굵기·끝 모양, 받침(원판)의 크기·모양, 금속 마감, 나사 구멍 같은 작은 부분. 각도·조명·배경 차이는 무시하세요. 확실히 다른 점이 있을 때만 ok를 false로 하세요. 아래 JSON 하나만 답하세요(다른 글 없이).\n{"ok":true,"issues":["다른 점을 짧은 한국어 문장으로, 최대 3개. 같으면 빈 목록"]}';
async function checkOne(j,signal){
  const p=getP(j.key),m=p&&p.id&&PH.get(p.id);if(!m||!hasPhoto(S.src))return false;
  const r=await claude(CHK_PROMPT,{signal,max:300,images:[await shrink(PH.get(S.src.id).blob,640,.8),await shrink(m.blob,640,.8)]});
  if(!r||typeof r!=='object'||typeof r.ok!=='boolean')return false;
  const cur=getP(j.key);if(!cur||cur.id!==p.id)return false;   // 그 사이 사진이 바뀌었으면 버려요
  cur.chk={ok:r.ok,issues:(Array.isArray(r.issues)?r.issues:[]).map(x=>String(x).slice(0,100)).filter(Boolean).slice(0,3)};return true;
}
async function runChecks(list,signal){
  if(!UI.check||!(await claudeReady(2)))return {n:0,bad:flagged().length,skipped:true};
  const L2=list.filter(j=>{const p=getP(j.key);return p&&p.ai&&!p.chk;});
  let nx=0,n=0,stop=false,err='';
  const wk=async()=>{while(!stop&&!(signal&&signal.aborted)){const i=nx++;if(i>=L2.length)return;try{if(await checkOne(L2[i],signal))n++;}catch(e){if(e&&(e.name==='AbortError'||e.code==='cancelled'))return;stop=true;err=(e&&e.text)||ASK_ERR[e&&e.code]||'검수를 하지 못했어요.';}}};
  await Promise.all(Array.from({length:Math.min(3,L2.length)},wk));

/* ============ 확대 위치 자동 맞춤(컴퓨터가 원본에서 손잡이를 찾아요 · 무료) ============ */
function dil(a,w,h,r){const t=new Uint8Array(a.length),o=new Uint8Array(a.length);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){let v=0;for(let i=-r;i<=r&&!v;i++){const xx=x+i;if(xx>=0&&xx<w&&a[y*w+xx])v=1;}t[y*w+x]=v;}
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){let v=0;for(let i=-r;i<=r&&!v;i++){const yy=y+i;if(yy>=0&&yy<h&&t[yy*w+x])v=1;}o[y*w+x]=v;}
  return o;}
async function findParts(blob){

  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d',{willReadFrequently:true});g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(bmp,0,0,w,h);
  const d=g.getImageData(0,0,w,h).data,N=w*h,L=new Float32Array(N);
  for(let p=0;p<N;p++)L[p]=.299*d[p*4]+.587*d[p*4+1]+.114*d[p*4+2];
  const E=new Uint8Array(N);   // 윤곽선만(그림자처럼 부드러운 변화는 빠져요)
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const p=y*w+x;if(Math.abs(L[p+1]-L[p-1])+Math.abs(L[p+w]-L[p-w])>30)E[p]=1;}
  const D=dil(E,w,h,2),out=new Uint8Array(N),st=[];
  const pu=p=>{if(D[p]||out[p])return;out[p]=1;st.push(p);};
  for(let x=0;x<w;x++){pu(x);pu((h-1)*w+x);}for(let y=0;y<h;y++){pu(y*w);pu(y*w+w-1);}
  while(st.length){const p=st.pop(),x=p%w,y=(p/w)|0;if(x>0)pu(p-1);if(x<w-1)pu(p+1);if(y>0)pu(p-w);if(y<h-1)pu(p+w);}
  const lab=new Int32Array(N);let best=0,bestN=0,id=0;
  for(let s0=0;s0<N;s0++){if(out[s0]||lab[s0])continue;id++;let n=0;const q=[s0];lab[s0]=id;
    while(q.length){const p=q.pop();n++;const x=p%w,y=(p/w)|0;
      if(x>0&&!out[p-1]&&!lab[p-1]){lab[p-1]=id;q.push(p-1);}if(x<w-1&&!out[p+1]&&!lab[p+1]){lab[p+1]=id;q.push(p+1);}
      if(y>0&&!out[p-w]&&!lab[p-w]){lab[p-w]=id;q.push(p-w);}if(y<h-1&&!out[p+w]&&!lab[p+w]){lab[p+w]=id;q.push(p+w);}}
    if(n>bestN){bestN=n;best=id;}}
  if(bestN<N*.015||bestN>N*.8)throw new Error('제품 위치를 찾지 못했어요.');
  const xs=[],ys=[];let sx=0,sy=0;for(let p=0;p<N;p++)if(lab[p]===best){const x=p%w,y=(p/w)|0;xs.push(x);ys.push(y);sx+=x;sy+=y;}
  const n=xs.length,cx=sx/n,cy=sy/n;let a=0,b=0,c2=0;
  for(let i=0;i<n;i++){const dx=xs[i]-cx,dy=ys[i]-cy;a+=dx*dx;b+=dx*dy;c2+=dy*dy;}
  const th=.5*Math.atan2(2*b,a-c2),ux=Math.cos(th),uy=Math.sin(th),vx=-uy,vy=ux,T=new Float32Array(n),Sv=new Float32Array(n);
  let t0=1e9,t1=-1e9;for(let i=0;i<n;i++){const dx=xs[i]-cx,dy=ys[i]-cy;T[i]=dx*ux+dy*uy;Sv[i]=dx*vx+dy*vy;if(T[i]<t0)t0=T[i];if(T[i]>t1)t1=T[i];}
  const len=t1-t0;if(len<w*.12)throw new Error('제품 위치를 찾지 못했어요.');

  const m1=(cnt[0]+cnt[1]+cnt[2])/3,m2=(cnt[bins-1]+cnt[bins-2]+cnt[bins-3])/3,ros=m2>=m1?1:-1;   // 두꺼운 쪽 끝이 받침
  const A=i=>ros>0?(T[i]-t0)/len:(t1-T[i])/len;   // 0 = 레버 끝, 1 = 받침 쪽 끝
  const at=(a0,a1)=>{let sT=0,sS=0,m=0;for(let i=0;i<n;i++){const v=A(i);if(v>=a0&&v<=a1){sT+=T[i];sS+=Sv[i];m++;}}if(!m)return null;const tt=sT/m,ss=sS/m;return {x:cx+ux*tt+vx*ss,y:cy+uy*tt+vy*ss};};
  const p1=at(.04,.2),p2=at(.6,.78);if(!p1||!p2)throw new Error('제품 위치를 찾지 못했어요.');

async function autoZoom(){
  const m=S.src&&PH.get(S.src.id);if(!m)return false;
  let P;try{P=await findParts(m.blob);}catch(e){return false;}

const svRR=(g,x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();};
function svWrap(g,text,maxW){
  const out=[];
  for(const para of String(text||'').split('\n')){
    let line='';
    for(const w of para.split(' ')){
      const t=line?line+' '+w:w;
      if(g.measureText(t).width<=maxW||!line){line=t;if(g.measureText(line).width>maxW){let cur='';for(const ch of line){if(g.measureText(cur+ch).width>maxW&&cur){out.push(cur);cur=ch;}else cur+=ch;}line=cur;}}
      else{out.push(line);line=w;}
    }
    if(line)out.push(line);
  }
  return out.slice(0,3);
}
function svPrep(sc,W,H){                         // 장면마다 한 번만: 흐린 배경 + 틀 그림자 + 글 줄바꿈

  g.drawImage(sc.img,(W-sc.img.width*s)/2,(H-sc.img.height*s)/2,sc.img.width*s,sc.img.height*s);g.filter='none';
  g.fillStyle=sc.kind==='outro'?'rgba(8,14,34,.74)':'rgba(8,14,34,.64)';g.fillRect(0,0,W,H);
  sc.fw=1008*k;
  if(sc.kind!=='outro'){
    sc.fh=(sc.kind==='zoom'||sc.kind==='color'?1008:clamp(Math.round(1008*sc.img.height/sc.img.width),560,1180))*k;
    sc.fy0=((sc.kind==='hero'?830:800)*k)-sc.fh/2;sc.fx0=(W-sc.fw)/2;
    g.save();svRR(g,sc.fx0,sc.fy0,sc.fw,sc.fh,28*k);g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=60*k;g.shadowOffsetY=22*k;g.fillStyle='#000';g.fill();g.restore();
  }

  async autozoom(){const ok=await autoZoom();UI.open.add('s-zoom');renderSide();refresh();toast(ok?'확대 3곳을 제품 위치에 맞췄어요.':'제품 위치를 찾지 못했어요. 슬라이더로 직접 맞춰 주세요.',3000);},
  async aboutai(){
    const text=($('#aboutPaste')||{}).value||'',say=(x,c)=>{const m=$('#aboutMsg');if(m){m.textContent=x;m.className='msg'+(c?' '+c:'');}};
    if(!text.trim()){say('자료를 먼저 붙여 넣어 주세요.','err');return;}
    if(!(await claudeReady(0))){say('클로드 키가 필요해요. 2단계에서 클로드 키를 넣고 연결 확인을 해 주세요.','err');return;}
    say('정리하는 중이에요…');
    try{
      const res=applyAbout(await claude(aboutPrompt(text),{max:2000}));
      UI.open.add('p4');UI.open.add('s-about');renderSide();refresh();
      const m=$('#aboutMsg');if(m){m.className='msg ok';m.textContent=res.n?res.n+'칸을 채웠어요. 번호와 날짜는 꼭 직접 확인해 주세요.'+(res.unclear.length?' 비워 둔 것: '+res.unclear.join(' / '):''):'채울 내용을 찾지 못했어요. 자료에 특허 번호나 연도가 들어 있는지 확인해 주세요.';}
    }catch(e){say((e&&e.text)||ASK_ERR[e&&e.code]||'정리하지 못했어요. 한 번 더 눌러 주세요.','err');}
  },
  gCheck,
  gAll(){gAsk(gList());},
  gStop(){if(G.ctl)G.ctl.abort();},
  gtest(){const l=gList(),j=l.find(x=>x.kind==='color')||l[0];if(j)gAsk([j]);else gMsg('만들 빈 칸이 없어요.','err');},
  gone(b){regen(jobs()[+b.dataset.i]);},
  gonehi(b){regen(jobs()[+b.dataset.i],{model:G.modelHi,fresh:true});},
  gfix(){const l=flagged();if(l.length)gAsk(l,{model:G.modelHi||G.model,fresh:true});},
  ggo(){$('#gConfirm').hidden=true;const l=G.pending||[],po=G.pendingOpts||undefined;G.pending=G.pendingOpts=null;gRun(l,po);},
  gno(){$('#gConfirm').hidden=true;G.pending=null;},
  async cCheck(){
    if(!C.key.trim()){cMsg('클로드 키를 붙여 넣어 주세요.','err');return;}
    cMsg('연결을 확인하는 중이에요. 비용이 들지 않아요…');
    try{const r=await fetch('https://api.anthropic.com/v1/models?limit=1',{headers:cHeaders()});
      if(r.ok){C.ok=true;C.bad=false;cMsg('연결됐어요. 글 새로 쓰기와 손잡이 모양 검수에 쓰여요.','ok');}
      else{C.ok=false;C.bad=true;let m='';try{const d=await r.json();m=d&&d.error&&d.error.message||'';}catch(x){}cMsg(cErr(r.status,m),'err');}
    }catch(x){C.ok=false;C.bad=false;cMsg('연결하지 못했어요. 인터넷 연결을 확인해 주세요.','err');}
    chip();
  }
};
side.addEventListener('click',e=>{
  const th=e.target.closest('.thumb');
  if(th&&th.dataset.drop){const inp=th.closest('.job,.pc').querySelector('input[type=file]');if(inp)inp.click();return;}
  const b=e.target.closest('[data-act]'),k=b?b.dataset.act:e.target.id;
  if(ACT[k])ACT[k](b||e.target,e);
});
const CHANGE={
  gRem(t){G.remember=t.checked;saveKey();},cRem(t){C.remember=t.checked;saveCKey();},
  useAI(t){UI.useAI=t.checked;},useChk(t){UI.check=t.checked;},
  gModelSel(t){G.model=t.value;G.auto=false;renderSide();},
  colorMode(t){const k=setColorMode(t.value);UI.open.add('p3');renderSide();refresh();toast(t.value==='lite'?'5칸으로 바꿨어요.'+(k?' 사진이 있는 '+k+'칸은 남겼어요.':''):'10칸으로 바꿨어요. 새 칸은 비어 있어요.',2600);}
};
side.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  if(CHANGE[t.id])return CHANGE[t.id](t);
  if(d.chk){setP(d.chk,t.checked);refresh();}
  else if(d.file){const f=t.files&&t.files[0];t.value='';if(f)putPhoto(d.file,f,d.ai==='1');}
  else if(d.view!==undefined){S.colors.items[+d.view].view=t.value;renderSide();refresh();}
  else if(d.dir!==undefined){S.colors.items[+d.dir].flip=t.value==='R';renderSide();refresh();}
});
side.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(d.k!==undefined){setP(d.k,t.value);if(isProductText(d.k))dirty=true;if(d.req)t.classList.toggle('blank',!t.value.trim());if(d.k==='name')syncPrompts();refresh();}
  else if(d.s){setP(d.s,Number(t.value)/100);if(t.nextElementSibling)t.nextElementSibling.textContent=t.value;refresh();}
  else if(t.id==='gKey'){G.key=t.value;if(G.state!=='idle')G.state='idle';saveKey();chip();}
  else if(t.id==='gModel'){G.model=t.value;G.auto=false;}
  else if(t.id==='cKey'){C.key=t.value;C.ok=false;C.bad=false;saveCKey();chip();}
  else if(t.id==='cModel')C.model=t.value;
});
function syncPrompts(){const J=jobs();$$('.job pre',side).forEach(p=>{const j=J[+p.dataset.j];if(j)p.textContent=promptOf(j);});}
['dragover','dragenter'].forEach(ev=>side.addEventListener(ev,e=>{const t=e.target.closest('.thumb');if(t&&t.dataset.drop){e.preventDefault();t.classList.add('drag');}}));
['dragleave','drop'].forEach(ev=>side.addEventListener(ev,e=>{const t=e.target.closest('.thumb');if(t)t.classList.remove('drag');}));
side.addEventListener('drop',e=>{const t=e.target.closest('.thumb');if(!t||!t.dataset.drop)return;e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)putPhoto(t.dataset.drop,f,!!t.closest('.job'));});

/* ============ 자동 업그레이드(인터넷 주소로 열었을 때만) ============
   열 때마다 최신 버전인지 확인해서, 새 버전이 있으면 스스로 새로고침해요. 작업은 자동 저장돼 있어서 그대로 이어져요.
   (한 번 새로고침했는데도 옛 화면이면 무한 반복하지 않고 맨 위에 "새 버전이 나왔어요" 버튼만 보여요) */
async function checkUpdate(auto){
  if(!/^https?:$/.test(location.protocol))return;
  try{
    const r=await fetch('version.json?'+Date.now(),{cache:'no-store'}),d=await r.json();
    if(!(d&&d.v>VER))return;
    const go=()=>{try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}location.href=location.pathname+'?v='+d.v;};
    let tried=0;try{tried=Number(sessionStorage.getItem('wj-upd')||0);}catch(e){}
    const busy=G.busy||oneBusy||EX.busy||SV.busy||!veil.hidden;
    if(auto&&!busy&&tried!==d.v){try{sessionStorage.setItem('wj-upd',String(d.v));}catch(e){}go();return;}
    const c=$('#updChip');c.hidden=false;c.onclick=go;
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate(false);});   // 창으로 돌아오면 버튼으로만 알려요(작업 중 갑자기 바뀌지 않게)
setInterval(()=>{if(!document.hidden)checkUpdate(false);},300000);

  checkUpdate(true);                                         // 열 때 최신인지 확인(새 버전이면 자동으로 새로고침)
})();
})();
