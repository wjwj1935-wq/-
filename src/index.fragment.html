<title>손잡이 상세페이지 제작기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&display=swap">
<style>
/* 왼쪽: 순서대로 따라가는 작업 칸(1 제품 → 2 키 → 3 만들기 → 4 다듬기), 오른쪽: 860px 상세페이지 실시간 미리보기 */
:root{
  --font:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --bg:#f3f5fa;--panel:#ffffff;--panel-2:#f6f8fc;--line:#d9e0ec;--ink:#14213d;--mute:#586478;
  --accent:#2a56a3;--accent-ink:#ffffff;--accent-soft:#e6eefb;
  --need:#ffe480;--need-ink:#5b4600;--ok:#1b7a52;--bad:#b3261e;--stage:#e1e7f1;
  --shadow:0 1px 2px rgba(16,28,59,.06),0 10px 28px rgba(16,28,59,.08);
  /* 상세페이지 자체 색(테마와 상관없이 고정) */
  --pg-ink:#14213d;--pg-mute:#5a6578;--pg-blue:#2a56a3;--pg-navy:#101c3b;--pg-navy-2:#1b2b52;--pg-navy-d:#0b1226;
  --pg-gold:#d9b45e;--pg-cream:#fbf2d9;--pg-soft:#eef2f8;--pg-line:#dfe5ef;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1320;--panel:#161d2e;--panel-2:#1b2438;--line:#2a3550;--ink:#e8edf7;--mute:#9aa7c0;
  --accent:#8fb0ee;--accent-ink:#0b1530;--accent-soft:#1f2b46;--need:#4a3d0a;--need-ink:#ffe480;--ok:#5fd0a0;--bad:#ff8a80;--stage:#0a0e19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1320;--panel:#161d2e;--panel-2:#1b2438;--line:#2a3550;--ink:#e8edf7;--mute:#9aa7c0;
  --accent:#8fb0ee;--accent-ink:#0b1530;--accent-soft:#1f2b46;--need:#4a3d0a;--need-ink:#ffe480;--ok:#5fd0a0;--bad:#ff8a80;--stage:#0a0e19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
.brand small{color:var(--mute);font-size:13px}
.top-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--need);color:var(--need-ink);cursor:pointer;border:0}

.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(340px,470px) minmax(0,1fr);gap:16px}
.side{overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-right:2px;min-width:0}
.stage-wrap{min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}
.stage-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--mute);font-size:13px}
.stage{flex:1;min-height:0;overflow:auto;background:var(--stage);border-radius:16px;padding:16px;display:flex;justify-content:center;align-items:flex-start}
.paper-wrap{flex:none;width:calc(860px*var(--s,1));height:calc(var(--h,1000)*1px*var(--s,1));position:relative}
.paper{position:absolute;left:0;top:0;transform:scale(var(--s,1));transform-origin:0 0;box-shadow:0 12px 40px rgba(0,0,0,.18)}

.step{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.step>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;font-weight:700;font-size:16px}
.step>summary::-webkit-details-marker{display:none}
.step .no{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:14px;font-weight:800}
.step .st{margin-left:auto;font-size:12px;font-weight:700;color:var(--mute)}
.step .body{padding:2px 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hint{margin:0;color:var(--mute);font-size:13px}
.sub{border:1px solid var(--line);border-radius:12px;background:var(--panel-2)}
.sub>summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:700;display:flex;gap:8px;align-items:center}
.sub>summary::-webkit-details-marker{display:none}
.sub>summary::after{content:"▾";margin-left:auto;color:var(--mute)}
.sub[open]>summary::after{content:"▴"}
.sub .body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:12px}
.sub .cnt{font-size:12px;font-weight:700;color:var(--need-ink);background:var(--need);border-radius:999px;padding:1px 8px}
.cmn{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px}
.blk{border:1px solid var(--line);border-radius:12px;background:var(--panel-2);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.blk h3{margin:0;font-size:14px}

.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>span{font-size:13px;font-weight:700;color:var(--mute)}
.f input[type=text],.f input[type=password],.f textarea,.f select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);min-width:0}
.f textarea{resize:vertical;line-height:1.5}
.f .blank{background:var(--need);border-color:#d3a800;color:var(--need-ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:10px;display:flex;flex-direction:column;gap:10px}
.item-h{display:flex;align-items:center;gap:6px}
.item-h b{font-size:13px}
.item-h .sp{flex:1}
.ib{min-width:34px;min-height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}
.ib:hover{border-color:var(--accent)}

.pc{display:flex;flex-direction:column;gap:8px}
.pc-top{display:flex;gap:10px;align-items:center}
.thumb{flex:none;width:64px;height:64px;border-radius:10px;border:1px dashed var(--line);background:var(--panel-2) center/cover no-repeat;display:grid;place-items:center;color:var(--mute);font-size:11px;text-align:center;cursor:pointer;overflow:hidden}
.thumb.drag{border-color:var(--accent);background-color:var(--accent-soft)}
.pc-btns{display:flex;gap:6px;flex-wrap:wrap}
.pos{font-size:13px}
.pos summary{cursor:pointer;color:var(--accent);font-weight:700}
.pos .sl{display:grid;grid-template-columns:48px 1fr 44px;gap:8px;align-items:center;margin-top:6px}
.pos output{font-variant-numeric:tabular-nums;color:var(--mute);text-align:right}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
.chk select{min-height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:2px 6px}
.flash{animation:flash 1.2s ease 1}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}

.checks{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.msg{font-size:14px;color:var(--mute)}
.msg.err{color:var(--bad);font-weight:700}
.msg.ok{color:var(--ok);font-weight:700}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border-radius:10px;background:var(--need);color:var(--need-ink);font-size:14px;font-weight:700}
.tip{padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:13px;color:var(--ink)}
.cost{font-size:12px;color:var(--mute);margin:0}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.job{display:grid;grid-template-columns:64px 1fr;gap:6px 12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
.job .meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.job .nm{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.job .ratio{font-size:12px;font-weight:700;color:var(--mute);background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.job .done{font-size:12px;color:var(--ok);font-weight:700}
.checks.pre{list-style:none;padding:0;margin:6px 0}.checks.pre li{margin:5px 0;line-height:1.5}.checks.pre li.bad{color:var(--bad);font-weight:700}.checks.pre li.warn{color:var(--ink)}
.m3dv{display:flex;flex-wrap:wrap;gap:6px}.m3dv figure{margin:0;width:92px;text-align:center;font-size:11px;color:var(--mute,#667)}.m3dv img{width:92px;height:92px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
#m3dJson{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;min-height:150px}
.cutbox{background:repeating-conic-gradient(#8a8f98 0 25%,#767b84 0 50%) 50%/20px 20px;padding:10px;border-radius:10px}.cutbox img{max-width:100%;display:block;margin:0 auto}
.capchips{gap:6px}.cchip{display:inline-flex;align-items:center;gap:2px}.cchip .ib{width:26px;height:26px}
.liblist{display:grid;gap:8px}.libc{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2)}.libc.cur{border-color:var(--accent);background:var(--accent-soft)}
.libt{width:64px;height:64px;flex:none;border-radius:8px;overflow:hidden;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--mute)}.libt img{width:100%;height:100%;object-fit:cover;display:block}
.libm{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.libn{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.libm small{color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.libb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}.libin{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
@media (max-width:560px){.libc{flex-wrap:wrap}.libb{width:100%;justify-content:flex-start}}
.job details{grid-column:1/-1}
.job.base{grid-template-columns:1fr;border:2px solid var(--accent,#2b59c3)}
.job.base.ok{border-color:var(--ok)}
.bcmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bfig{margin:0}
.bfig .bimg{aspect-ratio:1/1;border-radius:10px;background:var(--panel-2) center/contain no-repeat;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px}
.bfig figcaption{font-size:12px;text-align:center;margin-top:4px;color:var(--mute);font-weight:700}
.bfig .btn{width:100%;margin-top:4px}
.bfig .cost{font-size:11px}
.pg .sizebox{margin:44px auto 0;max-width:736px;text-align:center}
.pg .sizebox h3{margin:0 0 14px;font-size:32px;font-weight:800;letter-spacing:-.02em}
.pg .sdwrap{width:736px;margin:0 auto;background:#fff;border-radius:24px;overflow:hidden}
.pg .sddia{position:relative;margin:0 auto}
.pg .sddia i{display:block}
.pg .sdp{position:absolute;transform:translate(-50%,-50%);background:#fff;color:#2a56a3;font-weight:700;font-size:20px;padding:3px 9px;border:1.5px solid #2a56a3;border-radius:999px;white-space:nowrap}
.pg .sdr{position:absolute;transform:translate(-50%,-50%);text-align:center;font-size:20px;line-height:1.35;color:#66728a;font-weight:700;white-space:nowrap}
.pg .sdtb{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:10px;margin:18px auto 0}
.pg .sdr2{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid #d9e0ec;border-radius:14px;padding:14px 18px;font-size:24px}
.pg .sdr2 b{color:#586478;font-weight:700;text-align:left}
.pg .sdr2 span{font-weight:800;color:#14213d;white-space:nowrap}
.pg .sizeph{margin:36px auto 0;max-width:736px;padding:26px 20px;border:2px dashed #b8c4da;border-radius:18px;background:#eef2fa;color:#6b7a96;font-size:24px;text-align:center}
.pg .sdnote{margin:12px auto 0;max-width:736px;text-align:center;font-size:22px;line-height:1.5;color:var(--pg-mute)}
.pg .fxbox{max-width:736px;margin:44px auto 0;border-top:3px solid #14213d}
.pg .fxrow{display:flex;gap:24px;padding:22px 8px;border-bottom:1px solid #d9e0ec;font-size:26px;line-height:1.5;text-align:left}
.pg .fxrow b{flex:none;width:210px;color:var(--pg-mute);font-weight:700}
.pg .fxrow span{flex:1;min-width:0;font-weight:800;color:#14213d}
.pg .hk{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.pg .hk span{font-size:23px;font-weight:700;color:#fff;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.42);padding:8px 18px;border-radius:999px}.pg .hk.hkc{justify-content:center;margin-top:34px}
.pg .ptf{display:flex;align-items:center;gap:30px;margin-top:46px;padding:34px;border-radius:28px;background:linear-gradient(135deg,#101c3b,#1b2b52);color:#fff}.pg .ptd{flex:none;display:block;width:330px;height:264px;border-radius:20px;background:#fff}.pg .ptx{flex:1;min-width:0}
.pg .ptbig{display:block;font-size:96px;line-height:1;font-weight:900;color:var(--pg-gold);letter-spacing:-.03em}.pg .ptf h3{margin:16px 0 10px;font-size:36px;line-height:1.3;font-weight:800;letter-spacing:-.02em;text-wrap:balance}.pg .ptf p{margin:0;font-size:25px;line-height:1.6;color:#c6d0e6;text-wrap:pretty}
.pg .ptg{display:grid;grid-template-columns:356px 356px;gap:24px;margin-top:24px}.pg .ptg.top{margin-top:46px}.pg .ptg.odd .ptc:last-child{grid-column:1/-1}.pg .ptc{background:var(--pg-soft);border-radius:24px;padding:30px 24px;text-align:center}
.pg .ptc img{display:block;margin:0 auto 14px;width:64px;height:64px}.pg .ptc b{display:block;font-size:44px;line-height:1.15;font-weight:900;color:var(--pg-blue);letter-spacing:-.02em;overflow-wrap:anywhere}.pg .ptc h3{margin:10px 0 6px;font-size:27px;line-height:1.35;font-weight:800;text-wrap:balance}.pg .ptc p{margin:0;font-size:22px;line-height:1.55;color:var(--pg-mute);text-wrap:balance}
.pg .fit{max-width:736px;margin:46px auto 0}.pg .fitg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.pg .fitg.n2{grid-template-columns:repeat(2,1fr)}.pg .fitg.n1{grid-template-columns:1fr}
.pg .fitc{background:var(--pg-soft);border-radius:22px;padding:22px 10px 24px;text-align:center}.pg .fitc img{display:block;margin:0 auto 12px;width:200px;height:136px;max-width:100%;border-radius:14px}.pg .fitc span{display:block;font-size:23px;font-weight:700;color:var(--pg-mute)}.pg .fitc b{display:block;margin:4px 0 6px;font-size:38px;line-height:1.15;font-weight:900;color:#14213d;overflow-wrap:anywhere}.pg .fitc small{display:block;font-size:22px;line-height:1.4;color:var(--pg-mute)}
.pg .fxh{max-width:736px;margin:56px auto 0;font-size:30px;font-weight:800;text-align:left}.pg .fxbox.sub{margin-top:16px}
.pg .gp{margin-top:46px}.pg .gpc{margin-top:46px}.pg .gpc:first-child{margin-top:0}.pg .sec.gp1{padding-bottom:46px}.pg .sec.gp2{padding-top:0}.pg .gp2 .gp{margin-top:0}.pg .gpi{position:relative;width:736px;height:414px;border-radius:24px;overflow:hidden;background:#dfe5ec}.pg .gpi img{display:block;width:736px;height:414px}
.pg .gpi i{position:absolute;left:20px;top:20px;width:62px;height:62px;border-radius:50%;background:var(--pg-blue);color:#fff;font-style:normal;font-weight:800;font-size:30px;display:grid;place-items:center;box-shadow:0 4px 14px rgba(16,28,59,.25)}.pg .gpc h3{margin:22px 0 8px;text-align:center;font-size:32px;font-weight:800;letter-spacing:-.02em}.pg .gpc p{margin:0 auto;max-width:700px;text-align:center;font-size:27px;line-height:1.7;color:var(--pg-mute)}
.recog .rwrap{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:start}
.recog .rimg{position:relative;width:120px;background:#fff center/contain no-repeat;border:1px solid var(--line);border-radius:8px}
.recog .rbox{position:absolute;border:2px solid #e5384f;border-radius:4px}
.recog .rrow{display:grid;grid-template-columns:70px 1fr;gap:6px;font-size:13px;line-height:1.45;margin-bottom:4px}
.recog .rrow b{color:var(--mute)}
.job pre{margin:6px 0 0;white-space:pre-wrap;font:inherit;font-size:13px;color:var(--mute);background:var(--panel-2);border-radius:8px;padding:8px 10px}
.aitag{font-size:12px;color:var(--mute);cursor:pointer}
.cappick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cappick .cp{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);cursor:pointer;font:inherit}
.cappick .cp svg{width:44px;height:44px;fill:#dfe5f1;stroke:#7d8697;stroke-width:2}
.cappick .cp b{font-size:13px}.cappick .cp small{font-size:11px;color:var(--mute)}
.cappick .cp:hover{border-color:var(--accent)}
.cappick .cp.on{border-color:var(--accent);background:var(--accent-soft)}.cappick .cp.on svg{fill:#c6d6f4;stroke:var(--accent)}
.segpick{display:grid;gap:8px}.segpick.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.segpick.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.segpick .sg{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);cursor:pointer;font:inherit}
.segpick .sg b{font-size:13px}.segpick .sg small{font-size:11px;color:var(--mute)}.segpick .sg:hover{border-color:var(--accent)}
.segpick .sg.on{border-color:var(--accent);background:var(--accent-soft)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:50;box-shadow:var(--shadow);max-width:90vw}
.toast[hidden]{display:none}
.veil{position:fixed;inset:0;background:rgba(8,12,24,.55);z-index:40;display:grid;place-items:center;padding:16px}
.exscroll{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.exscroll img{display:block;width:100%;height:auto}
.dlg{width:min(520px,100%);max-height:90%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg h2{margin:0;font-size:18px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt b{display:block;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

const madeCount=o=>{let n=0;const walk=x=>{if(!x||typeof x!=='object')return;if(x.ai===true&&x.id)n++;for(const k in x)walk(x[k]);};walk(o);return n;};
function snapPrev(){
  if(!hasPhoto(S.src))return null;
  const cur=Object.assign({},S,{prev:null}),n=madeCount(cur)+((cur.baseCands||[]).filter(hasPhoto).length);
  if(!n&&!hasPhoto(S.base))return null;
  return {at:Date.now(),name:String(S.name||'').slice(0,40),n,s:JSON.parse(JSON.stringify(cur))};
}
async function restorePrev(){

const PH=new Map(),PENDING=new Set(),LIBIDS=new Set();   // LIBIDS: '내 상세페이지'에 보관 중인 페이지가 쓰는 사진 번호(gc가 보관소에서 지우지 않아요)
//                 // id -> {blob,url,w,h}
const idb={db:null,mem:new Map(),
  open(){return new Promise(res=>{try{const r=indexedDB.open('wj-dp',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>res();}catch(e){res()}})},
  tx(m){return this.db.transaction('p',m).objectStore('p')},
  put(id,v){this.mem.set(id,v);if(!this.db)return Promise.resolve();return new Promise(r=>{try{const q=this.tx('readwrite').put(v,id);q.onsuccess=q.onerror=()=>r()}catch(e){r()}})},
  get(id){if(this.mem.has(id))return Promise.resolve(this.mem.get(id));if(!this.db)return Promise.resolve(null);return new Promise(r=>{try{const q=this.tx('readonly').get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})},
  del(id){this.mem.delete(id);if(!this.db)return;try{this.tx('readwrite').delete(id)}catch(e){}},
  keys(){const m=[...this.mem.keys()];if(!this.db)return Promise.resolve(m);return new Promise(r=>{try{const q=this.tx('readonly').getAllKeys();q.onsuccess=()=>r([...new Set(m.concat(q.result||[]))]);q.onerror=()=>r(m);}catch(e){r(m);}});}
};
function remember(id,blob,w,h){PH.set(id,{blob,w,h,url:URL.createObjectURL(blob)});}
async function ingest(file){
  if(!file||!/^image\//.test(file.type))throw new Error('이미지 파일이 아니에요.');
  let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'});}
  catch(e){bmp=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('사진을 읽지 못했어요.'));i.src=URL.createObjectURL(file);});}
  const iw=bmp.width||bmp.naturalWidth,ih=bmp.height||bmp.naturalHeight,k=Math.min(1,2400/Math.max(iw,ih));
  const w=Math.max(1,Math.round(iw*k)),h=Math.max(1,Math.round(ih*k));
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  const png=file.type==='image/png'||file.type==='image/webp';
  if(!png){g.fillStyle='#fff';g.fillRect(0,0,w,h);}
  g.drawImage(bmp,0,0,w,h);
  const blob=await new Promise(r=>c.toBlob(r,png?'image/png':'image/jpeg',.92));
  if(!blob)throw new Error('사진을 읽지 못했어요.');
  const id=uid();PENDING.add(id);remember(id,blob,w,h);await idb.put(id,{blob,w,h});
  return {id,w,h};
}
function usedIds(){const s=new Set();const walk=o=>{if(!o||typeof o!=='object')return;if(typeof o.id==='string'&&o.w&&o.h)s.add(o.id);for(const k in o)walk(o[k]);};walk(S);return s;}
function gc(){const u=usedIds();for(const [id,m] of PH){if(!u.has(id)&&!PENDING.has(id)){try{URL.revokeObjectURL(m.url)}catch(e){}PH.delete(id);if(!LIBIDS.has(id))idb.del(id);}}}

  else setP(path,Object.assign({id:meta.id,w:meta.w,h:meta.h,fx:.5,fy:.5,z:1,ai:false},extra||{}));

/* ============ 내 상세페이지 (v93) ============

   - 새 제품 · 다른 페이지 열기 · 파일 불러오기 전에는 지금 페이지를 먼저 보관해요.

function libIdSet(){const s=new Set();const walk=o=>{if(!o||typeof o!=='object')return;if(typeof o.id==='string'&&o.w&&o.h)s.add(o.id);for(const k in o){if(k==='prev')continue;walk(o[k]);}};walk(S);return s;}

function libReindex(oldIds){   // 보관 중인 사진 표를 다시 만들고, 어느 쪽에도 안 쓰이게 된 사진은 보관소에서 지워요

}

function diaImg(key,w,h,draw){   // 그림을 한 번 그려 두고 다시 써요(2배 크기로 선명하게)

const diaRR=(g,x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();};

function focusEl(el){
  if(!el)return;
  let d=el.parentElement;while(d&&d!==side){if(d.tagName==='DETAILS'){d.open=true;if(d.id)UI.open.add(d.id);}d=d.parentElement;}
  const b=el.closest('.f,.pc,.job,.item,.blk')||el;b.scrollIntoView({block:'center',behavior:'smooth'});b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash');
  if(/INPUT|TEXTAREA/.test(el.tagName))setTimeout(()=>el.focus({preventScroll:true}),250);
}

const PLATE_PROMPT='첨부한 사진은 방문(실내문) 손잡이 제품입니다. 문에 닿는 받침(카바) 부분 전체가 들어가는 가장 작은 사각 영역을 찾아 주세요. 레버가 받침과 만나는 목 부분은 조금 포함해도 됩니다. 좌표는 사진 전체의 폭·높이에 대한 0~1 비율로, 왼쪽 위 모서리(x0,y0)와 오른쪽 아래 모서리(x1,y1)입니다. 아래 JSON 하나만 답하세요(다른 글 없이).\n{"found":true,"x0":0.0,"y0":0.0,"x1":0.0,"y1":0.0}\n받침이 보이지 않으면 {"found":false}.';
let PLATE={id:'',box:null,p:null};
async function plateFind(id){
  try{
    if(!(await claudeReady(1)))return null;
    const r=await claude(PLATE_PROMPT,{max:200,images:[await shrink(PH.get(id).blob,1024,.88)]});
    if(!r||r.found!==true)return null;
    const x0=Number(r.x0),y0=Number(r.y0),x1=Number(r.x1),y1=Number(r.y1);
    if(![x0,y0,x1,y1].every(isFinite)||!(x1>x0)||!(y1>y0)||x0<-.02||y0<-.02||x1>1.02||y1>1.02||(x1-x0)<.1||(y1-y0)<.1||(x1-x0)*(y1-y0)>.9)return null;   // 엉뚱한 상자는 쓰지 않아요
    const px=(x1-x0)*.12,py=(y1-y0)*.12;
    return {x0:clamp(x0-px,0,1),y0:clamp(y0-py,0,1),x1:clamp(x1+px,0,1),y1:clamp(y1+py,0,1)};
  }catch(e){return null;}

async function plateBox(){
  if(!hasPhoto(S.src))return null;

async function plateCrop(box){

function preSizeRatio(){   // 입력한 치수로 본 '레버 폭 ÷ 받침의 짧은 변'

function claimScan(){
  const out=[],texts=claimTexts();
  claimRules().forEach(r=>{
    const hits=[];
    texts.forEach(x=>{
      r.re.lastIndex=0;const ws=[];let m,first=-1;
      while((m=r.re.exec(x.t))){
        if(m.index===r.re.lastIndex)r.re.lastIndex++;
        if(/^1\s?[위등]/.test(m[0])&&m.index>0&&/[0-9]/.test(x.t[m.index-1]))continue;   // 11위·21위처럼 앞에 숫자가 붙은 것은 '1위'가 아니에요
        const w=m[0].trim();if(first<0)first=m.index;if(w&&!ws.includes(w))ws.push(w);
      }
      if(ws.length)hits.push({lab:x.lab,ws,snip:x.t.slice(Math.max(0,first-8),first+18).trim()});
    });
    hits.slice(0,3).forEach((h,i)=>out.push({lvl:r.lvl,id:'claim_'+r.id+'_'+i,rule:r.id,lab:h.lab,words:h.ws,text:'"'+h.ws.join('·')+'" — '+h.lab+' 「'+h.snip+'」 · '+r.ask}));
    if(hits.length>3)out.push({lvl:r.lvl,id:'claim_'+r.id+'_more',rule:r.id,lab:'',words:[],text:'같은 종류의 표현이 '+(hits.length-3)+'곳 더 있어요.'});
  });
  return out;
}

function preNorm(r){

async function preRun(){

  if(!(await claudeReady(1))){toast('클로드 키를 2단계에서 넣어 주세요(클로드 안에서 열었다면 바로 써요).',3600);return;}

  try{
    const r=await claude(PRE_PROMPT(preTexts()),{images:[await shrink(PH.get(S.src.id).blob,1024,.88)],max:900,tier:'default'});
    PRE.cache={sig:preSig(),res:preNorm(r),at:Date.now()};
  }catch(e){toast((e&&e.text)||ASK_ERR[e&&e.code]||'점검하지 못했어요. 한 번 더 눌러 주세요.',4200);}

  if(sm){if(!images)return true;try{const l=await sm.limits();return !!(l&&l.images&&(l.images.maxCount||0)>=images);}catch(e){return false;}}
  return !!C.key.trim();
}
/* 클로드를 부르는 길은 이 함수 하나예요(글 쓰기와 검수가 같이 써요) */
async function claude(prompt,o){
  o=o||{};const imgs=o.images||[],sm=await claudeAvail();
  if(sm){try{return await sm.json(prompt,Object.assign({signal:o.signal,modelTier:o.tier||'quick'},imgs.length?{images:imgs}:{}));}catch(e){throw e&&e.name==='AbortError'?{code:'cancelled'}:e;}}
  if(!C.key.trim())throw {code:'unavailable'};
  const content=[];for(const b of imgs)content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:await toB64(b)}});content.push({type:'text',text:prompt});
  let r;
  try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:o.signal,headers:cHeaders(),body:JSON.stringify({model:o.model||(C.model||'').trim()||CMODEL,max_tokens:o.max||2000,messages:[{role:'user',content}]})});}
  catch(e){if(e&&e.name==='AbortError')throw {code:'cancelled'};throw {code:'api_error',text:'클로드에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.'};}
  if(!r.ok){let m='';try{const d=await r.json();m=d&&d.error&&d.error.message||'';}catch(e){}throw {code:'api_error',status:r.status,text:cErr(r.status,m)};}
  const d=await r.json();return parseJsonLoose((d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n'));
}

function applyPlan(p){

  const s=(v,n)=>typeof v==='string'&&v.trim()?v.trim().slice(0,n||300):null,put=(path,v)=>{if(v!==null)setP(path,v);};
  const h=p.hero||{};put('hero.badge',s(h.badge,40));put('hero.title',s(h.title,80));put('hero.sub',s(h.sub,140));
  const c=p.concept||{};put('concept.title',s(c.title,60));put('concept.body',s(c.body,200));
  const z=p.zoom||{};(Array.isArray(z.items)?z.items:[]).slice(0,S.zoom.items.length).forEach((it,i)=>{if(!it)return;put('zoom.items.'+i+'.title',s(it.title,60));put('zoom.items.'+i+'.body',s(it.body,160));});
  if(Array.isArray(p.faq)){
    const f=p.faq.map(x=>x&&s(x.q,80)&&s(x.a,260)?{q:s(x.q,80),a:s(x.a,260),p:true}:null).filter(Boolean).slice(0,2);
    if(f.length){const all=S.faq.items;let pos=all.findIndex(q=>q.p);const rest=all.filter(q=>!q.p);if(pos<0)pos=Math.max(0,rest.length-1);rest.splice(Math.min(pos,rest.length),0,...f);S.faq.items=rest;}
  }
}

  +' 비교할 것: 레버의 길이·굵기·끝 모양, 레버 윗면의 굴곡이나 움푹 파인 곳(원본에 있는데 매끈하게 사라졌는지), 레버와 받침을 잇는 목 부분, 받침(카바)의 모양(원형·정사각형·직사각형)과 가로세로 비율·크기·두께·테두리·안쪽 링, 금속 마감, 나사 구멍 같은 작은 부분. 각도·조명·배경·문 색 차이는 무시하세요. 또, 두 번째 사진에서 손잡이(레버 끝부터 받침까지)가 화면 가장자리에서 잘려 있거나 일부가 화면 밖으로 나가 있으면 ok를 false로 하고 issues에 "손잡이가 화면 밖으로 잘렸어요"를 넣으세요(손이 가리는 것은 잘린 것이 아닙니다). 이 제품만의 알아볼 수 있는 특징이 달라졌거나 흔한 다른 손잡이처럼 단순해졌다면 ok를 false로 하세요. 사소한 차이만 있을 때는 ok를 true로 하세요. 아래 JSON 하나만 답하세요(다른 글 없이).\n{"ok":true,"issues":["다른 점을 짧은 한국어 문장으로, 최대 3개. 같으면 빈 목록"]}';};
let chkModel='claude-sonnet-5-5';   // 검수는 사진을 더 정확히 보는 모델로(없으면 기본 모델로 물러나요)
async function checkOne(j,signal){

  const ed=j.kind==='edit'&&hasPhoto(S.base);   // 편집 칸은 확정한 기준 사진과 비교해요(비슷한 두 장 비교라 값싼 기본 모델로 충분해요)
  const imgs=[await shrink(PH.get(ed?S.base.id:S.src.id).blob,800,.85),await shrink(m.blob,j.kind==='sheet'?1400:800,.85)];
  const dt=ed?'':(j.kind==='color'||j.kind==='comp')?sideName(S.colors.items[j.i]&&S.colors.items[j.i].flip?'R':'L'):j.kind==='base'?sideName((S.colors.items[whiteIdx()]||{}).flip?'R':'L'):(j.kind==='hero'||j.kind==='concept')&&S.lvDir&&S.src&&S.lvDir.id===S.src.id?sideName(S.lvDir.dir):'';
  const it0=(j.kind==='edit'||j.kind==='color'||j.kind==='comp')?S.colors.items[j.i]:null,cx=it0?{scene:String(it0.scene||it0.label||'').trim(),hand:isHand(it0)}:null;
  let r;
  try{r=await claude(chkPrompt(ed?'edit':j.kind,dt,cx),{signal,max:400,images:imgs,model:((C.model||'').trim()||ed)?'':chkModel});}
  catch(e){if(e&&e.status===404&&chkModel&&!ed){chkModel='';r=await claude(chkPrompt(j.kind,dt,cx),{signal,max:400,images:imgs,model:''});}else throw e;}
  if(!r||typeof r!=='object'||typeof r.ok!=='boolean')return false;
  const cur=getP(j.key);if(!cur||cur.id!==p.id)return false;   // 그 사이 사진이 바뀌었으면 버려요
  cur.chk={ok:r.ok,issues:(Array.isArray(r.issues)?r.issues:[]).map(x=>String(x).slice(0,100)).filter(Boolean).slice(0,3)};return true;
}
async function runChecks(list,signal){
  if(!UI.check||!(await claudeReady(2)))return {n:0,bad:flagged().length,skipped:true};
  const L2=list.filter(j=>{const p=getP(j.key);return p&&p.ai&&!p.chk;});
  let nx=0,n=0,stop=false,err='';
  const wk=async()=>{while(!stop&&!(signal&&signal.aborted)){const i=nx++;if(i>=L2.length)return;try{if(await checkOne(L2[i],signal))n++;}catch(e){if(e&&(e.name==='AbortError'||e.code==='cancelled'))return;stop=true;err=(e&&e.text)||ASK_ERR[e&&e.code]||'검수를 하지 못했어요.';}}};
  await Promise.all(Array.from({length:Math.min(3,L2.length)},wk));
  refresh();return {n,bad:flagged().length,err};
}

/* 제품 특징 메모: 클로드가 사진을 보고, 이미지 AI가 틀리기 쉬운 이 제품만의 모양을 글로 적어요(구글에 같이 보내요) */
const SPEC_PROMPT='첨부한 사진은 실제 방문(실내문) 손잡이 제품입니다. 이미지 AI가 이 제품을 정확히 다시 그릴 수 있도록, 사진에 실제로 보이는 모양만 글로 적어 주세요. 보이지 않는 것은 추측하지 말고, 재질 이름이나 사양 수치는 쓰지 마세요.\n적을 것: ① 레버 전체 모양(굵기가 어디서 어떻게 변하는지, 끝 모양, 윗면이나 옆면의 굴곡·움푹 파인 곳·홈의 위치) ② 레버가 받침과 만나는 목 부분의 모양 ③ 받침(카바)의 모양(위에서 봤을 때 둥근 원판인지, 네모난 직사각형·정사각형인지 꼭 구분하고, 직사각형이면 가로와 세로 중 어느 쪽이 얼마나 긴지 대략의 비율도)·두께·테두리·안쪽 링 ④ 뒤쪽에 보이는 나사·기둥 ⑤ 금속 마감과 색 느낌 ⑥ 레버 길이와 받침 지름의 대략적인 비율.\n그리고 이미지 AI가 흔히 틀리게 그리는 부분을 최대 3개 적어 주세요(예: 움푹 파인 곳을 없애고 매끈한 막대로 그림).\n아래 JSON 하나만 답하세요(다른 글 없이).\n{"kind":"제품 종류를 짧게(예: 레버형 방문 손잡이)","lever":"레버 모양 한 문장","rosette":"받침(카바) 모양 한 문장(직사각형이면 어느 쪽이 얼마나 긴지도)","rosetteShape":"받침을 위에서 본 모양. 둥글면 round, 가로·세로가 같은 정사각형이면 square, 직사각형이면 rect, 사각형인데 모서리가 눈에 띄게 둥글면 rrect, 타원·육각 등 그 밖은 other, 사진으로 알 수 없으면 unknown 중 하나만","finish":"금속 마감과 색 한 문장","features":["이 제품만의 눈에 띄는 특징을 짧게, 최대 4개"],"spec":"쉬운 한국어로 4~7문장","never":["이렇게 그리면 틀려요 한 문장"]}';
async function writeSpec(signal,keep){   // keep: 사장님이 직접 적은 특징 메모는 덮어쓰지 않아요
  if(!hasPhoto(S.src))throw {code:'unavailable'};
  const r=await claude(SPEC_PROMPT,{signal,max:900,images:[await shrink(PH.get(S.src.id).blob,1024,.88)]});
  const sp=String(r&&r.spec||'').trim().slice(0,700);if(!sp)throw {code:'invalid_json'};
  const nv=(Array.isArray(r.never)?r.never:[]).map(x=>String(x).trim().slice(0,120)).filter(Boolean).slice(0,3);
  if(!keep)S.spec=sp+(nv.length?'\n※ 이렇게 그리면 틀려요: '+nv.join(' / '):'');
  const t=(v,n)=>typeof v==='string'?v.trim().slice(0,n):'';
  S.recog={id:S.src.id,kind:t(r.kind,40),lever:t(r.lever,120),rosette:t(r.rosette,120),finish:t(r.finish,80),features:(Array.isArray(r.features)?r.features:[]).map(x=>t(String(x),60)).filter(Boolean).slice(0,4)};
  S.capShape={id:S.src.id,shape:capShapeOf(r.rosetteShape,r.rosette)};applyCapShape(S.capShape.shape);
}
/* ---- 캡 모양 자동 인식: 클로드가 사진에서 본 받침 모양(원형·직사각형)을 크기 안내의 '캡 모양'에 맞춰요 ----
   직접 고른 모양(shapeSet='user')은 건드리지 않고(버튼으로 직접 시킬 때만 바꿔요), 확실하지 않으면(그 밖의 모양·알 수 없음) 그대로 둬요.
   사진 인식을 이미 해 둔 작업(캡 모양을 아직 안 본 작업)도 열 때 한 번, 또는 버튼으로 알아봐요. */
function capShapeOf(v,txt){   // 클로드의 한 단어 답 → round | square | rect | rrect | other | unknown (한 단어가 없으면 설명 글에서 분명한 말만 봐요)
  const w=String(v||'').toLowerCase().trim();
  if(/^(rrect|rounded)/.test(w)||/모서리가 ?(많이 |크게 )?둥|둥근 ?사각|둥근 ?모서리|라운드/.test(w))return 'rrect';
  if(/^square/.test(w)||/^정사각/.test(w))return 'square';
  if(/^rect/.test(w)||/직사각|네모|사각/.test(w))return 'rect';
  if(/^(round|circle)/.test(w)||/^(원형|둥근|원|동그란)$/.test(w))return 'round';
  if(w==='other')return 'other';
  if(!w){const t=String(txt||'');if(/모서리가 ?(많이 |크게 )?둥|둥근 ?사각|둥근 ?모서리|라운드/.test(t))return 'rrect';if(/정사각/.test(t))return 'square';if(/직사각|네모|사각형/.test(t))return 'rect';if(/원형|둥근|동그란|둥글/.test(t))return 'round';}
  return 'unknown';
}
function capKnown(){   // 지금 제품 사진에서 알아본 캡 모양(없으면 빈 글)
  const id=S.src&&S.src.id;if(!id)return '';
  if(S.capShape&&S.capShape.id===id)return S.capShape.shape||'';
  if(S.recog&&S.recog.id===id&&S.recog.shape)return S.recog.shape;   // 버전 71에서 인식한 작업
  return '';
}
function capInfo(){   // 받침(카바) 모양·크기 정보. 사장님이 고르거나 클로드가 알아본 모양일 때만 써요(확인 안 된 기본값 '원형'은 쓰지 않아요)
  const Z=S.size||{};let sh=(Z.shapeSet==='user'||Z.shapeSet==='auto')?Z.shape:'';
  if(CAP_SHAPES.indexOf(sh)<0)sh=capKnown();
  if(CAP_SHAPES.indexOf(sh)<0)return null;
  const n=v=>{const x=parseFloat(String(v==null?'':v).replace(/[^0-9.]/g,''));return x>0&&isFinite(x)?x:0;};
  const d=n(Z.cap),w=n(Z.capW),h=n(Z.capH),f=v=>String(Math.round(v*10)/10);let t='';
  if(sh==='round')t='둥근 원판(원형)이고'+(d?' 지름이 약 '+f(d)+'mm입니다':'입니다')+'. 사각형으로 바꾸지 마세요.';
  else if(sh==='square')t='정사각형이고'+(w?' 한 변이 약 '+f(w)+'mm입니다':'입니다')+'. 직사각형이나 원형으로 바꾸지 마세요.';
  else{
    const nm=sh==='rrect'?'모서리가 둥근 직사각형':'직사각형';
    if(w&&h){const r=w/h;t=nm+'이고, 레버를 가로로 놓고 정면에서 봤을 때 가로(좌우) 약 '+f(w)+'mm × 세로(위아래) 약 '+f(h)+'mm입니다(가로:세로 ≈ '+(Math.round(r*100)/100)+' : 1, '+(r>1.08?'가로로 긴 모양':r<.92?'세로로 긴 모양':'거의 정사각형')+'). 사진이 비스듬해 보여도 실제 모양은 이 수치입니다. 정사각형이나 원형으로 바꾸지 마세요.';}
    else t=nm+'입니다(정사각형·원형이 아님). 가로와 세로 길이가 다른 모양을 사진 그대로 유지하세요.';
  }
  return {shape:sh,text:t,w:w,h:h,d:d};
}
const capLine=()=>{const c=capInfo();return c?'받침(카바)은 '+c.text:'';};
function capUiLine(){   // 기준 설치 사진 칸: 어떤 받침 정보가 AI에게 가는지 보여 줘요
  const c=capInfo();
  if(!c)return '<p class="hint" style="color:var(--bad)">⚠ 받침(캡) 모양을 아직 정하지 않았어요. 정하지 않으면 AI가 받침 모양을 마음대로 바꿀 수 있어요. 크기 안내의 <b>캡 모양</b>에서 골라 주세요.</p>';
  const nm=CAP_NAMES[c.shape],dims=c.shape==='round'?(c.d?' · 지름 '+c.d+'mm':''):c.shape==='square'?(c.w?' · 한 변 '+c.w+'mm':''):(c.w&&c.h?' · 가로 '+c.w+' × 세로 '+c.h+'mm':'');
  const miss=c.shape==='round'?!c.d:c.shape==='square'?!c.w:!(c.w&&c.h);
  return '<p class="hint">받침 정보(지시문과 검수에 같이 보내요): <b>'+nm+dims+'</b>'+(miss?' <span style="color:var(--bad)">· 치수를 적으면 비율까지 지켜요</span>':'')+'. 클로드를 쓸 수 있으면 받침 부분을 크게 오려서 참고 사진으로도 같이 보내요.'+(reachInfo()?' 레버 길이 비율(받침 가로의 약 '+(Math.round(reachInfo().ratio*10)/10)+'배)과 ':' 총 길이와 받침 치수를 모두 적으면 레버 길이 비율도 알려 줘요. ')+(fixedLine()?'고정 메모도 같이 가요.':'')+'</p>';
}
function applyCapShape(sh,force){
  if(CAP_SHAPES.indexOf(sh)<0)return false;
  const Z=S.size;if(!Z)return false;
  if(!force){
    if(Z.shapeSet==='user')return false;

function capHint(){

  else if(!Z.shapeSet)h+='<div class="hint">⚠ 캡 모양을 아직 확인하지 않았어요. 지금은 <b>'+nm[cur]+'</b>으로 그려요. '+(hasPhoto(S.src)?'아래 단추로 사진에서 알아보거나 ':'')+'위에서 직접 골라 주세요.</div>';
  const cap=String(Z.cap==null?'':Z.cap).trim();
  if(cur==='square'&&cap&&!String(Z.capW||'').trim())h+='<div class="hint">원형 지름으로 적어 둔 <b>'+esc(cap)+'</b>은 정사각형의 한 변으로 옮기지 않았어요. 아래에 캡 한 변을 직접 적어 주세요(그림이 나와요).</div>';
  else if((cur==='rect'||cur==='rrect')&&cap&&!String(Z.capW||'').trim()&&!String(Z.capH||'').trim())h+='<div class="hint">원형 지름으로 적어 둔 <b>'+esc(cap)+'</b>은 '+nm[cur]+'의 가로·세로로 옮기지 않았어요. 아래에 캡 가로·캡 세로를 직접 적어 주세요(그림이 나와요).</div>';

}
function capBtn(){
  if(!hasPhoto(S.src))return '';
  return '<div class="acts"><button class="btn sm" type="button" data-act="capshape"'+(CAPBUSY?' disabled':'')+'>'+(CAPBUSY?'사진을 보는 중이에요…':'사진으로 캡 모양 알아보기 (약 1센트)')+'</button></div>';
}
function capRow(){   // '사진 인식 결과' 칸에 한 줄
  const Z=S.size||{},nm=CAP_NAMES,sh=capKnown();
  if(!sh)return '아직 알아보지 못했어요. 크기 안내의 "사진으로 캡 모양 알아보기"를 눌러 보세요.';
  if(nm[sh])return nm[sh]+(Z.shapeSet==='auto'&&Z.shape===sh?' · 크기 안내의 캡 모양에 맞췄어요':Z.shapeSet==='user'&&Z.shape!==sh?' · 크기 안내는 직접 고른 값 그대로예요':'');
  return sh==='other'?'원형·사각형이 아닌 모양이에요. 크기 안내의 캡 모양은 직접 골라 주세요.':'사진으로는 알 수 없어요. 크기 안내의 캡 모양은 직접 골라 주세요.';

/* ============ 쇼핑몰에 올리기: 네이버 쇼핑용 파일 묶음 (쿠팡·11번가·옥션·지마켓은 나중에) ============

const MS_BLUR=(()=>{try{return 'filter' in CanvasRenderingContext2D.prototype;}catch(e){return false;}})();   // 캔버스 흐림 효과를 쓸 수 있는 브라우저만(아니면 흰 바탕)

function msEdge(bmp){   // 사진 가장자리의 평균 색과 '얼마나 고른지'(작을수록 한 가지 색 배경)
  const k=Math.min(1,160/Math.max(bmp.width,bmp.height)),w=Math.max(8,Math.round(bmp.width*k)),h=Math.max(8,Math.round(bmp.height*k)),[c,g]=msCv(w,h);

function msContain(bmp,size){   // 사진 전체가 잘리지 않게 정사각 안에 넣어요(남는 자리는 흐린 같은 사진, 안 되는 브라우저는 흰 바탕)

async function msMain(){   // 대표 이미지: 원본 사진으로만, 글자·로고 없이 제품이 가운데에 크게

}

  L.push({ok:true,t:'대표 이미지: 정사각 '+m.w+'×'+m.h+' JPG ('+kb(m.blob)+'), 원본 사진만 쓰고 글자·로고는 넣지 않았어요. '+how});

  if(r.skipped>0)L.push({ok:false,t:'추가 이미지는 '+MS_MAXX+'장까지만 만들어서 '+r.skipped+'장은 뺐어요.'});

function clearMade(){
  let made=0,extra=0,kept=0;
  const wipe=path=>{const p=getP(path);if(!hasPhoto(p))return;if(p.ai||p.real){setP(path,null);made++;}else kept++;};
  wipe('hero.photo');wipe('concept.photo');wipe('sheetImg');
  if(hasPhoto(S.base)){S.base=null;made++;}S.baseOk=false;   // 기준 사진과 후보도 옛 제품 것이라 지워요
  made+=candList().length;S.baseCands=[];
  S.colors.items.forEach((it,i)=>wipe('colors.items.'+i+'.photo'));
  (S.extra||[]).forEach((p,i)=>{if(hasPhoto(p)){setP('extra.'+i,null);extra++;}});
  S.holds={};S.model3d=null;G.cache.clear();gc();
  return {made,extra,kept};
}
async function rotSrc(deg){       // 제품 사진이 옆으로 누워 있을 때 90도씩 돌려요(돌린 사진이 새 제품 사진이 돼요)
  const m=S.src&&PH.get(S.src.id);if(!m)return;
  try{
    const bmp=await createImageBitmap(m.blob),w=bmp.width,h=bmp.height,c=document.createElement('canvas');c.width=h;c.height=w;
    const g=c.getContext('2d');g.translate(h/2,w/2);g.rotate(deg*Math.PI/180);g.drawImage(bmp,-w/2,-h/2);
    const png=/png/.test(m.blob.type),blob=await new Promise(r=>c.toBlob(r,png?'image/png':'image/jpeg',.95));
    if(!blob)throw new Error('사진을 돌리지 못했어요.');
    await putPhoto('src',new File([blob],'rotated.'+(png?'png':'jpg'),{type:blob.type}));
  }catch(e){toast((e&&e.message)||'사진을 돌리지 못했어요.');}
}

    S.colors.items.forEach(it=>{if(hasPhoto(it.photo)&&it.photo.ai){it.photo=null;n++;}});S.holds={};   // 이전 방식으로 만든 칸은 새 기준과 섞이지 않게 지워요
    const w=whiteIdx();if(w>=0)S.colors.items[w].photo=Object.assign({},S.base,{chk:null});
    gc();renderSide();refresh();
    toast('기준 사진을 확정했어요.'+(n?' 이전에 만든 문 색상 '+n+'칸은 지웠어요.':'')+' 이제 \'빈 칸 모두 만들기\'나 \'한 번에 만들기\'를 누르면 나머지 문 색상을 만들어요.',5200);
  },
  async grecheck(){   // 이미 만든 사진을 새 기준(잘림 포함)으로 다시 검수해요
    if(G.busy)return;
    if(!UI.check){gMsg('2단계에서 "만든 사진을 원본과 비교해 검수"를 켜 주세요.','err');UI.open.add('p2');renderSide();return;}
    if(!(await claudeReady(2))){gMsg('클로드 키가 필요해요. 2단계에서 넣어 주세요.','err');UI.open.add('p2');renderSide();return;}
    const L=jobs().filter(j=>{const p=getP(j.key);return p&&p.ai&&hasPhoto(p);});
    if(!L.length)return;
    L.forEach(j=>{delete getP(j.key).chk;});
    G.busy=true;renderSide();gMsg('만든 사진 '+L.length+'장을 다시 검수하는 중이에요…');
    let r=null;try{r=await runChecks(L);}catch(e){}
    G.busy=false;renderSide();refresh();
    gMsg('검수를 마쳤어요.'+(r&&r.bad?' 원본과 달라 보이거나 손잡이가 잘린 칸이 '+r.bad+'개 있어요. 아래 \'달라 보이는 칸만 정밀 모델로 다시\'를 눌러 다시 만드세요.':' 문제가 보이는 칸은 없어요.')+(r&&r.err?' ('+r.err+')':''),r&&r.bad?'err':'ok');
  },
  ggo(){$('#gConfirm').hidden=true;const l=G.pending||[],po=G.pendingOpts||undefined;G.pending=G.pendingOpts=null;gRun(l,po);},
  gno(){$('#gConfirm').hidden=true;G.pending=null;},
  async cCheck(){
    if(!C.key.trim()){cMsg('클로드 키를 붙여 넣어 주세요.','err');return;}
    cMsg('연결을 확인하는 중이에요. 비용이 들지 않아요…');
    try{const r=await fetch('https://api.anthropic.com/v1/models?limit=1',{headers:cHeaders()});
      if(r.ok){C.ok=true;C.bad=false;cMsg('연결됐어요. 사진 인식, 제품 글, 손잡이 모양 검수에 쓰여요.'+(C.remember?'':' 다음에 다시 넣지 않으려면 \'이 컴퓨터에 기억하기\'를 켜세요(공용 컴퓨터는 빼고).'),'ok');recognize().catch(()=>{});}
      else{C.ok=false;C.bad=true;let m='';try{const d=await r.json();m=d&&d.error&&d.error.message||'';}catch(x){}cMsg(cErr(r.status,m),'err');}
    }catch(x){C.ok=false;C.bad=false;cMsg('연결하지 못했어요. 인터넷 연결을 확인해 주세요.','err');}
    chip();
  }
};

};
side.addEventListener('change',e=>{

/* ============ 자동 업그레이드(인터넷 주소로 열었을 때만) ============
   새 버전이 나오면 스스로 새로고침해서 바꿔요. 작업은 자동 저장돼 있어서 그대로 이어져요.
   - 열 때, 다른 창에 갔다가 돌아올 때: 바로 바꿔요.
   - 열어 둔 채로 있을 때: 1분마다 확인하고, 45초 동안 아무것도 안 만졌을 때 바꿔요.
   - 사진·글을 만드는 중, 영상 녹화 중, 창이 열려 있을 때는 끝난 뒤에 바꿔요(그동안은 맨 위에 "새 버전이 나왔어요" 버튼).
   - 새로고침 주소에 시간을 붙여서, 인터넷 저장본(캐시)이 옛 화면을 줘도 새 화면을 받아요.
   - 같은 버전은 한 창에서 최대 2번만 자동으로 시도해요(무한 반복 방지). 그래도 안 바뀌면 버튼만 보여요. */
try{if(/[?&]t=\d+/.test(location.search))history.replaceState(null,'',location.pathname);}catch(e){}   // 주소에 붙인 시간 표시는 새 화면이 뜨면 지워요
let LASTACT=Date.now();
['pointerdown','keydown','input','wheel','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{LASTACT=Date.now();},{passive:true,capture:true}));
const updBusy=()=>G.busy||oneBusy||EX.busy||VD.busy||YT.busy||MK.busy||MS.busy||!veil.hidden;
let updTimer=0;
async function checkUpdate(mode){
  if(!/^https?:$/.test(location.protocol))return;
  try{
    const r=await fetch('version.json?'+Date.now(),{cache:'no-store'}),d=await r.json();
    if(!(d&&d.v>VER))return;
    const go=()=>{try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}try{if(G.key.trim()||C.key.trim())sessionStorage.setItem('wj-kt',JSON.stringify({g:G.key,c:C.key}));}catch(e){}location.href=location.pathname+'?v='+d.v+'&t='+Date.now();};
    const chipOn=()=>{const c=$('#updChip');c.hidden=false;c.onclick=go;};
    let tried={};try{tried=JSON.parse(sessionStorage.getItem('wj-upd2')||'{}')||{};}catch(e){tried={};}
    const n=Number(tried[d.v]||0),idle=Date.now()-LASTACT>45000;
    if(!updBusy()&&n<2&&(mode!=='tick'||idle)){
      let saved=false;try{tried[d.v]=n+1;sessionStorage.setItem('wj-upd2',JSON.stringify(tried));saved=true;}catch(e){}
      if(saved){   // 시도 횟수를 적어 둘 수 있을 때만 자동으로 바꿔요(못 적으면 무한 반복할 수 있어서 버튼만 보여요)
        toast('새 버전('+d.v+')으로 바꿔요. 작업은 그대로 이어져요.',1500);
        clearTimeout(updTimer);updTimer=setTimeout(()=>{if(updBusy())chipOn();else go();},1100);
        return;
      }
    }
    chipOn();
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate('back');});
setInterval(()=>{if(!document.hidden)checkUpdate('tick');},60000);

  checkUpdate('open');                                       // 열 때 최신인지 확인(새 버전이면 자동으로 새로고침)
})();
